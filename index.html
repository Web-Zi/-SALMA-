<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SALMA Cafe - نظام الجرد</title>
  <link rel="manifest" href="manifest.json">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf.js for Arabic PDF rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            salma: {
              DEFAULT: '#3B3B98',
              dark: '#2A2A72',
              gold: '#F5CD79'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">

  <!-- First Time Device Frame Selector -->
  <div id="frameModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
      <h2 class="text-xl font-bold mb-4 text-salma">اختر نمط عرض الشاشة</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">يمكنك ضبط واجهة التطبيق لتناسب جهازك</p>
      <div class="grid grid-cols-2 gap-4">
        <button onclick="setDeviceMode('phone')" class="p-4 border-2 border-salma rounded-xl hover:bg-salma/10 flex flex-col items-center">
          <span class="text-3xl mb-2">📱</span>
          <span class="font-bold">هاتف</span>
        </button>
        <button onclick="setDeviceMode('tablet')" class="p-4 border-2 border-salma rounded-xl hover:bg-salma/10 flex flex-col items-center">
          <span class="text-3xl mb-2">💻</span>
          <span class="font-bold">تابلت</span>
        </button>
      </div>
    </div>
  </div>

  <!-- App Main Container -->
  <div id="appContainer" class="mx-auto transition-all duration-300 min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="bg-salma text-white p-4 shadow-lg sticky top-0 z-40">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3 space-x-reverse">
          <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-inner overflow-hidden p-0.5">
  <img src="salma-logo.png" alt="SALMA Logo" class="w-full h-full object-cover rounded-lg">
</div>
          <div>
            <h1 class="text-xl font-bold tracking-wide">SALMA CAFE</h1>
            <p id="headerBranchInfo" class="text-xs text-salma-gold">فرع: الرئيسي | هاتف: 01000000000</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="toggleDarkMode()" id="darkModeBtn" class="p-2 bg-salma-dark rounded-lg hover:bg-opacity-80">🌙</button>
          <button onclick="openSettingsModal()" class="p-2 bg-salma-dark rounded-lg hover:bg-opacity-80">⚙️</button>
        </div>
      </div>
    </header>

    <!-- Controls -->
    <div class="p-4 bg-white dark:bg-gray-800 shadow-md flex flex-wrap gap-3 justify-between items-center">
      <div class="flex items-center gap-2">
        <label class="font-bold text-sm">التاريخ:</label>
        <input type="date" id="inventoryDate" class="p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
      </div>
      <button onclick="saveAndSendReport()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-xl shadow transition-colors flex items-center gap-2">
        <span>💾</span> حفظ ورفع الملف (PDF)
      </button>
    </div>

    <!-- Scrollable Category Bar -->
    <div class="px-4 pt-3 bg-gray-50 dark:bg-gray-850">
      <div id="categoryTabs" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
        <!-- Dynamic Category Tabs -->
      </div>
    </div>

    <!-- Table Container -->
    <main class="flex-1 p-4 overflow-x-auto">
      <div id="pdfExportTarget" class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden p-2">
        <table class="w-full text-right border-collapse min-w-[700px]">
          <thead>
            <tr class="bg-salma text-white text-sm">
              <th class="p-3 border-b border-salma-dark">الأصناف</th>
              <th class="p-3 border-b border-salma-dark">
                <div class="flex items-center justify-between">
                  <span>المستلم</span>
                  <button onclick="toggleLock('mustalam')" id="btnLockMustalam" class="text-xs bg-salma-dark px-2 py-1 rounded">🔒 مغلق</button>
                </div>
              </th>
              <th class="p-3 border-b border-salma-dark">الجديد</th>
              <th class="p-3 border-b border-salma-dark">
                <div class="flex items-center justify-between">
                  <span>المسلم</span>
                  <button onclick="toggleLock('musallam')" id="btnLockMusallam" class="text-xs bg-salma-dark px-2 py-1 rounded">🔒 مغلق</button>
                </div>
              </th>
              <th class="p-3 border-b border-salma-dark">العدد (تلقائي)</th>
              <th class="p-3 border-b border-salma-dark">الملاحظات</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody" class="divide-y divide-gray-200 dark:divide-gray-700 text-sm">
            <!-- Rows inserted via JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Password Prompt Modal -->
  <div id="pwdModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl w-80 shadow-2xl">
      <h3 id="pwdTitle" class="font-bold text-lg mb-4">أدخل كلمة المرور</h3>
      <input type="password" id="pwdInput" class="w-full p-2 border rounded mb-4 text-black dark:bg-gray-700 dark:text-white" placeholder="****">
      <div class="flex justify-end gap-2">
        <button onclick="closePwdModal()" class="px-4 py-2 text-gray-500">إلغاء</button>
        <button onclick="submitPassword()" class="px-4 py-2 bg-salma text-white rounded">تأكيد</button>
      </div>
    </div>
  </div>

  <!-- Admin Settings Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl">
      <h2 class="text-xl font-bold mb-4 border-b pb-2 text-salma">إعدادات النظام (Admin)</h2>
      
      <!-- Branch Info -->
      <div class="mb-4">
        <h3 class="font-semibold text-sm mb-2">بيانات الفرع</h3>
        <input type="text" id="settingBranchName" placeholder="اسم الفرع" class="w-full p-2 border rounded mb-2 dark:bg-gray-700">
        <input type="text" id="settingBranchPhone" placeholder="رقم الهاتف" class="w-full p-2 border rounded dark:bg-gray-700">
      </div>

      <!-- Password Change -->
      <div class="mb-4">
        <h3 class="font-semibold text-sm mb-2">تغيير كلمات المرور</h3>
        <input type="password" id="pwdAdmin" placeholder="كلمة سر الأدمن الجديدة" class="w-full p-2 border rounded mb-2 dark:bg-gray-700">
        <input type="password" id="pwdMustalam" placeholder="كلمة سر عمود المستلم" class="w-full p-2 border rounded mb-2 dark:bg-gray-700">
        <input type="password" id="pwdMusallam" placeholder="كلمة سر عمود المسلم" class="w-full p-2 border rounded dark:bg-gray-700">
      </div>

      <!-- Add Category -->
      <div class="mb-4 border-t pt-3">
        <h3 class="font-semibold text-sm mb-2">إضافة قسم جديد</h3>
        <div class="flex gap-2">
          <input type="text" id="newCategoryName" placeholder="اسم القسم الجديد" class="flex-1 p-2 border rounded dark:bg-gray-700">
          <button onclick="addNewCategory()" class="bg-salma text-white px-4 py-2 rounded font-bold">إضافة</button>
        </div>
      </div>

      <!-- Add Item -->
      <div class="mb-4 border-t pt-3">
        <h3 class="font-semibold text-sm mb-2">إضافة صنف جديد</h3>
        <select id="settingCategorySelect" class="w-full p-2 border rounded mb-2 dark:bg-gray-700"></select>
        <input type="text" id="newItemName" placeholder="اسم الصنف" class="w-full p-2 border rounded mb-2 dark:bg-gray-700">
        <button onclick="addNewItem()" class="w-full bg-salma text-white py-2 rounded font-bold">إضافة الصنف</button>
      </div>

      <!-- Category & Item List with Delete Options -->
      <div class="mb-4 border-t pt-3">
        <h3 class="font-semibold text-sm mb-2 text-red-600">إدارة وحذف الأقسام والأصناف</h3>
        <div id="adminCategoryList" class="space-y-3 max-h-48 overflow-y-auto p-2 border rounded dark:bg-gray-750">
          <!-- Dynamic Admin Delete Controls -->
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeSettingsModal()" class="px-4 py-2 border rounded">إغلاق</button>
        <button onclick="saveSettings()" class="px-4 py-2 bg-green-600 text-white rounded font-bold">حفظ التغييرات</button>
      </div>
    </div>
  </div>

  <script>
    // --- Firebase Setup ---
    const firebaseConfig = {
      apiKey: "AIzaSyApjPEfBwq7dRy8MPgC8eiQ8U1hhkiBZXQ",
      authDomain: "salmacafe-b9e81.firebaseapp.com",
      projectId: "salmacafe-b9e81",
      storageBucket: "salmacafe-b9e81.firebasestorage.app",
      messagingSenderId: "624228348063",
      appId: "1:624228348063:web:4e0f3e18497eba2909b2aa",
      measurementId: "G-FL6F3K4MZ4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // App State
    let config = {
      adminPwd: 'admin',
      mustalamPwd: '123',
      musallamPwd: '456',
      branchName: 'الرئيسي',
      branchPhone: '01000000000',
      locked: { mustalam: true, musallam: true }
    };

    let selectedCategory = 'ALL';
    let userInputs = {};

    let inventoryData = [
      { category: 'المشروبات الساخنة والشاي', items: ['كوفي ميكس', 'نسكافيه بلاك', 'بنجورنو بندق', 'بنجورنو فانيلا', 'لاتيه', 'لاتيه كرميل', 'موكه', 'هوت شوكلت برباك', 'هوت شوكلت كابري', 'هوت ميلك موز', 'هوت ميلك فراولة', 'هوت ميلك توت', 'بطاطا بودر', 'شاي السلام', 'احمد تي قرنفل', 'شاي لبتن', 'شاي فواكه', 'شاي اخضر', 'زنجبيل ليمون', 'ينسون', 'نعناع', 'كركديه'] },
      { category: 'الشوكولاتة والصوصات والإضافات', items: ['شيكولاته وايت', 'شيكولاته براون', 'شيكولاته كندر', 'شيكولاته لوتس', 'شيكولاته بندق', 'صوص كرميل', 'صوص درك', 'صوص كوكيز', 'صوص بندق', 'صوص جوز هند', 'صوص فراولة', 'كريم باستري', 'اضافة بندق مبشور', 'اضافة مرشملو', 'جالون اوريو', 'جالون لوتس', 'علبة كيري', 'علبة جلاكسي', 'علبة مندولين', 'قرنفل حبوب', 'جوز هند خشن'] },
      { category: 'بن، مخبوزات وحشوات', items: ['سكر', 'بن فاتح سادة', 'بن فاتح محوج', 'بن غامق محوج', 'بن بندق', 'اسبرسو', 'توست', 'كرواسون', 'تشيز كيك', 'اكلير', 'ملفاي', 'براونز', 'دوناتس', 'عجينة وافل', 'عجينة كباكي', 'ساندوتش ميكس جبن تركي', 'كوب دوناتس', 'غطاء دوناتس', 'فاكهة حشو فراولة', 'فاكهة حشو عنب بري'] },
      { category: 'الأكواب والأدوات الاستهلاكية', items: ['كوب سخن 4', 'كوب سخن 7', 'كوب سخن 8', 'كوب سخن 12', 'غطاء سخن', 'كوب سقعان 10', 'كوب سقعان 12', 'كوب سقعان 16', 'كوب صن داي', 'غطاء سقعان', 'علب وافل M', 'علب وافل L', 'علب وافل XL', 'جراب بوست', 'جراب أيس كريم', 'ورق زيدة', 'سندضة بلاستيك', 'شاليموه', 'معالق', 'شوكة', 'سكينة', 'أكياس كراش', 'أطباق فوم'] },
      { category: 'النكهات والأيس كريم', items: ['جلي كولا', 'كريز', 'مانجه', 'أناناس', 'خوخ', 'باشون فروت', 'تفاح أخضر', 'ليمون', 'جوز هند', 'بلو بيري', 'بلو راس بيري', 'راس بيري', 'ميكس بيري', 'بطيخ', 'فراولة', 'نعناع', 'ايس كريم 10 ك', 'دفاربي بودر', 'بالتة صودا', 'كيوي', 'حامل أطباق كوبايات'] },
      { category: 'مستلزمات التشغيل والمواد الخام', items: ['مكسرات سحلب', 'عصير تفاح', 'زبيب', 'قرفة عيدان', 'سحلب', 'فانيليا', 'بيكينج بودر', 'زبده', 'كرتونة مياه', 'بالتة ردبل', 'مناديل', 'بكر استريتش', 'باليته تشيز كيك', 'علبة كرواسون', 'دقيق', 'زيت', 'مفرش سفرة', 'بكر كاشير', 'لبن'] }
    ];

    let activeAuthTarget = null;

    function setDeviceMode(mode) {
      const container = document.getElementById('appContainer');
      container.className = mode === 'phone' 
        ? 'max-w-md mx-auto transition-all duration-300 min-h-screen border-x shadow-2xl bg-white dark:bg-gray-800' 
        : 'max-w-4xl mx-auto transition-all duration-300 min-h-screen border-x shadow-2xl bg-white dark:bg-gray-800';
      document.getElementById('frameModal').classList.add('hidden');
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('darkModeBtn').innerText = isDark ? '☀️' : '🌙';
    }

    // Auto-calculate "العدد": Mustalam + Jadid - Musallam
    function saveInputValue(item, field, val) {
      if (!userInputs[item]) userInputs[item] = {};
      userInputs[item][field] = val;

      const mustalam = parseFloat(userInputs[item].mustalam) || 0;
      const jadid = parseFloat(userInputs[item].jadid) || 0;
      const musallam = parseFloat(userInputs[item].musallam) || 0;

      const count = mustalam + jadid - musallam;
      userInputs[item].count = count;

      const countEl = document.getElementById(`count-${item}`);
      if (countEl) {
        countEl.value = count;
      }
    }

    function renderCategoryTabs() {
      const container = document.getElementById('categoryTabs');
      container.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${selectedCategory === 'ALL' ? 'bg-salma text-white shadow-md' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200'}`;
      allBtn.innerText = 'عرض الكل';
      allBtn.onclick = () => { selectedCategory = 'ALL'; renderCategoryTabs(); renderTable(); };
      container.appendChild(allBtn);

      inventoryData.forEach(c => {
        const btn = document.createElement('button');
        btn.className = `px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${selectedCategory === c.category ? 'bg-salma text-white shadow-md' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200'}`;
        btn.innerText = c.category;
        btn.onclick = () => { selectedCategory = c.category; renderCategoryTabs(); renderTable(); };
        container.appendChild(btn);
      });
    }

    function renderTable() {
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = '';

      const categoriesToRender = selectedCategory === 'ALL' 
        ? inventoryData 
        : inventoryData.filter(c => c.category === selectedCategory);

      categoriesToRender.forEach(cat => {
        const catRow = document.createElement('tr');
        catRow.className = 'bg-salma/10 font-bold text-salma dark:text-salma-gold';
        catRow.innerHTML = `<td colspan="6" class="p-2 text-center bg-gray-200 dark:bg-gray-700">${cat.category}</td>`;
        tbody.appendChild(catRow);

        cat.items.forEach(item => {
          const mustalamVal = userInputs[item]?.mustalam || '';
          const jadidVal = userInputs[item]?.jadid || '';
          const musallamVal = userInputs[item]?.musallam || '';
          const countVal = userInputs[item]?.count !== undefined ? userInputs[item].count : '';
          const noteVal = userInputs[item]?.note || '';

          const row = document.createElement('tr');
          row.className = 'hover:bg-gray-50 dark:hover:bg-gray-750';
          row.innerHTML = `
            <td class="p-2 border font-medium">${item}</td>
            <td class="p-1 border"><input type="number" value="${mustalamVal}" oninput="saveInputValue('${item}', 'mustalam', this.value)" ${config.locked.mustalam ? 'disabled' : ''} class="w-full p-1 border rounded text-center dark:bg-gray-700 ${config.locked.mustalam ? 'bg-gray-100 dark:bg-gray-800' : ''}"></td>
            <td class="p-1 border"><input type="number" value="${jadidVal}" oninput="saveInputValue('${item}', 'jadid', this.value)" class="w-full p-1 border rounded text-center dark:bg-gray-700"></td>
            <td class="p-1 border"><input type="number" value="${musallamVal}" oninput="saveInputValue('${item}', 'musallam', this.value)" ${config.locked.musallam ? 'disabled' : ''} class="w-full p-1 border rounded text-center dark:bg-gray-700 ${config.locked.musallam ? 'bg-gray-100 dark:bg-gray-800' : ''}"></td>
            <td class="p-1 border"><input type="number" id="count-${item}" value="${countVal}" disabled class="w-full p-1 border rounded text-center font-bold bg-gray-100 dark:bg-gray-800 text-salma dark:text-salma-gold"></td>
            <td class="p-1 border"><input type="text" value="${noteVal}" oninput="saveInputValue('${item}', 'note', this.value)" class="w-full p-1 border rounded text-right dark:bg-gray-700"></td>
          `;
          tbody.appendChild(row);
        });
      });
    }

    function toggleLock(column) {
      if (!config.locked[column]) {
        config.locked[column] = true;
        updateLockUI(column);
        renderTable();
      } else {
        activeAuthTarget = column;
        document.getElementById('pwdTitle').innerText = `كلمة مرور عمود (${column === 'mustalam' ? 'المستلم' : 'المسلم'})`;
        document.getElementById('pwdModal').classList.remove('hidden');
      }
    }

    function submitPassword() {
      const val = document.getElementById('pwdInput').value;
      if (activeAuthTarget === 'mustalam' && val === config.mustalamPwd) {
        config.locked.mustalam = false;
      } else if (activeAuthTarget === 'musallam' && val === config.musallamPwd) {
        config.locked.musallam = false;
      } else if (activeAuthTarget === 'admin' && val === config.adminPwd) {
        closePwdModal();
        showAdminSettings();
        return;
      } else {
        alert('كلمة المرور غير صحيحة!');
        return;
      }
      updateLockUI(activeAuthTarget);
      closePwdModal();
      renderTable();
    }

    function updateLockUI(column) {
      const btn = document.getElementById(column === 'mustalam' ? 'btnLockMustalam' : 'btnLockMusallam');
      if (config.locked[column]) {
        btn.innerText = '🔒 مغلق';
        btn.className = 'text-xs bg-salma-dark px-2 py-1 rounded text-white';
      } else {
        btn.innerText = '🔓 مفتوح';
        btn.className = 'text-xs bg-green-600 px-2 py-1 rounded text-white';
      }
    }

    function closePwdModal() {
      document.getElementById('pwdModal').classList.add('hidden');
      document.getElementById('pwdInput').value = '';
    }

    function openSettingsModal() {
      activeAuthTarget = 'admin';
      document.getElementById('pwdTitle').innerText = 'أدخل كلمة مرور الأدمن';
      document.getElementById('pwdModal').classList.remove('hidden');
    }

    function renderAdminCategoryList() {
      const select = document.getElementById('settingCategorySelect');
      select.innerHTML = '';
      inventoryData.forEach((c, idx) => {
        select.innerHTML += `<option value="${idx}">${c.category}</option>`;
      });

      const listContainer = document.getElementById('adminCategoryList');
      listContainer.innerHTML = '';

      inventoryData.forEach((c, catIdx) => {
        const catBox = document.createElement('div');
        catBox.className = 'border p-2 rounded bg-gray-50 dark:bg-gray-800';
        catBox.innerHTML = `
          <div class="flex justify-between items-center border-b pb-1 mb-1 font-bold">
            <span class="text-salma dark:text-salma-gold">${c.category}</span>
            <button onclick="deleteCategory(${catIdx})" class="text-red-500 hover:text-red-700 text-xs font-bold flex items-center gap-1">
              🗑️ حذف القسم
            </button>
          </div>
          <div class="space-y-1 pl-2">
            ${c.items.map((item, itemIdx) => `
              <div class="flex justify-between items-center text-xs">
                <span>• ${item}</span>
                <button onclick="deleteItem(${catIdx},${itemIdx})" class="text-red-400 hover:text-red-600">🗑️</button>
              </div>
            `).join('')}
          </div>
        `;
        listContainer.appendChild(catBox);
      });
    }

    function showAdminSettings() {
      document.getElementById('settingBranchName').value = config.branchName;
      document.getElementById('settingBranchPhone').value = config.branchPhone;
      renderAdminCategoryList();
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function addNewCategory() {
      const catName = document.getElementById('newCategoryName').value.trim();
      if (catName) {
        inventoryData.push({ category: catName, items: [] });
        document.getElementById('newCategoryName').value = '';
        renderAdminCategoryList();
        renderCategoryTabs();
        renderTable();
      }
    }

    function deleteCategory(catIdx) {
      if (confirm(`هل أنت تأكد من حذف قسم "${inventoryData[catIdx].category}" بجميع أصنافه؟`)) {
        inventoryData.splice(catIdx, 1);
        renderAdminCategoryList();
        renderCategoryTabs();
        renderTable();
      }
    }

    function deleteItem(catIdx, itemIdx) {
      inventoryData[catIdx].items.splice(itemIdx, 1);
      renderAdminCategoryList();
      renderTable();
    }

    function addNewItem() {
      const catIdx = document.getElementById('settingCategorySelect').value;
      const itemName = document.getElementById('newItemName').value.trim();
      if (itemName && catIdx !== '') {
        inventoryData[catIdx].items.push(itemName);
        document.getElementById('newItemName').value = '';
        renderAdminCategoryList();
        renderTable();
      }
    }

    function saveSettings() {
      config.branchName = document.getElementById('settingBranchName').value || config.branchName;
      config.branchPhone = document.getElementById('settingBranchPhone').value || config.branchPhone;
      
      if (document.getElementById('pwdAdmin').value) config.adminPwd = document.getElementById('pwdAdmin').value;
      if (document.getElementById('pwdMustalam').value) config.mustalamPwd = document.getElementById('pwdMustalam').value;
      if (document.getElementById('pwdMusallam').value) config.musallamPwd = document.getElementById('pwdMusallam').value;

      document.getElementById('headerBranchInfo').innerText = `فرع: ${config.branchName} | هاتف: ${config.branchPhone}`;
      closeSettingsModal();
      alert('تم حفظ الإعدادات بنجاح!');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    // --- Save Report as Arabic PDF & Push to Firebase ---
    async function saveAndSendReport() {
      const dateStr = document.getElementById('inventoryDate').value || new Date().toISOString().split('T')[0];
      const timeStr = new Date().toLocaleTimeString('ar-EG');
      const fileName = `SALMA_Report_${config.branchName}_${dateStr}.pdf`;

      // Structure report payload data for database sync
      let reportTableData = [];
      inventoryData.forEach(cat => {
        cat.items.forEach(item => {
          const inp = userInputs[item] || {};
          const mustalam = inp.mustalam || '-';
          const jadid = inp.jadid || '-';
          const musallam = inp.musallam || '-';
          const count = inp.count !== undefined ? inp.count : '-';
          const note = inp.note || '-';

          reportTableData.push({ category: cat.category, item, mustalam, jadid, musallam, count, note });
        });
      });

      // Export Arabic PDF using html2pdf
      const element = document.getElementById('pdfExportTarget');
      const opt = {
        margin:       0.3,
        filename:     fileName,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      try {
        await html2pdf().set(opt).from(element).save();

        // Save report payload to Firebase Cloud Firestore
        await db.collection("reports").add({
          branchName: config.branchName,
          branchPhone: config.branchPhone,
          date: dateStr,
          time: timeStr,
          fileName: fileName,
          reviewed: false,
          tableData: reportTableData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert('تم حفظ التقرير بملف PDF وإرساله سحابياً إلى Main-SALMA بنجاح!');
        
        // Reset Inputs after successful submission
        userInputs = {};
        config.locked.mustalam = true;
        config.locked.musallam = true;
        updateLockUI('mustalam');
        updateLockUI('musallam');
        renderTable();
      } catch (err) {
        console.error(err);
        alert('حدث خطأ أثناء حفظ الملف أو الإرسال!');
      }
    }

    // Init
    document.getElementById('inventoryDate').value = new Date().toISOString().split('T')[0];
    renderCategoryTabs();
    renderTable();
  </script>
</body>
</html>
